<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر التوعية الأمنية</title>
<style>
body {
  font-family: Arial;
  background: #171923;
  color: white;
  text-align: center;
  padding: 40px 15px;
}
.box {
  background: #292d3e;
  padding: 25px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
}
h1 { color: #8ddcff; }
p { line-height: 2; }
</style>
</head>
<body>
<div class="box">
<h1>🔐 مختبر التوعية الأمنية</h1>
<h2>هل تستطيع اكتشاف الرابط المضلل؟</h2>
<p>ليس كل رابط يبدو رسميًا رابطًا موثوقًا!</p>
<p>تحقق دائمًا من اسم النطاق قبل الضغط.</p>
<p>لا تدخل كلمة مرورك في صفحات مجهولة.</p>
<hr>
<h3>انتهت المحاكاة التعليمية</h3>
<p>هذه صفحة توعوية لا تجمع أي بيانات شخصية.</p>
</div>
</body>
</html>
